[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tei-editor"
version = "1.0.0"
description = "Éditeur graphique de bureau pour XML-TEI P5"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "lxml>=5.0",
]

[project.optional-dependencies]
spellcheck = ["pyspellchecker>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
tei-editor = "tei_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Sans ceci, `pip install` n'embarque que les fichiers `.py` : le catalogue
# TEI, les profils, les schémas RelaxNG, les icônes et les données de
# jeux de balises (tous sous `src/tei_editor/data/`) manqueraient à
# l'installation, alors qu'ils sont indispensables à l'exécution (phase 9,
# vérifié par une installation réelle dans un venv propre — voir
# `docs/INSTALLATION.md`).
tei_editor = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
